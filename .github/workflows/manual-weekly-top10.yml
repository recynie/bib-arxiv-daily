name: arxiv-weekly-manual-top10

on:
  workflow_dispatch:

jobs:
  recommend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HF_HOME: .hf-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore library.bib from secret
        run: |
          if [ -n "${{ secrets.LIBRARY_BIB }}" ]; then
            mkdir -p data
            echo "${{ secrets.LIBRARY_BIB }}" > data/library.bib
            echo "Restored library.bib ($(wc -c < data/library.bib) bytes)"
          else
            echo "No LIBRARY_BIB secret set; using example file"
            cp data/library.example.bib data/library.bib 2>/dev/null || true
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Hugging Face model files
        uses: actions/cache@v5
        with:
          path: .hf-cache
          key: hf-${{ runner.os }}-${{ hashFiles('requirements.txt', 'config.yaml') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Cache library embeddings
        uses: actions/cache@v5
        with:
          path: .cache/recommender
          key: lib-emb-${{ runner.os }}-${{ hashFiles('requirements.txt', 'config.yaml', 'data/**/*.bib') }}
          restore-keys: |
            lib-emb-${{ runner.os }}-

      - name: Install CPU PyTorch
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3.0"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly report
        run: python src/main.py --config config.yaml --lookback-days 7 --max-candidates 500 --max-results 10 --output-html "docs/weekly/$(date -u '+%Y/%m/%d')/index.html"

      - name: Rebuild index page
        run: PYTHONPATH=src python -c "from pathlib import Path; from index_builder import build_index_html; Path('docs/index.html').write_text(build_index_html(Path('docs')), encoding='utf-8')"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
          git add docs/
          git diff --cached --quiet || git commit -m "Add weekly arXiv recommendations for $(date -u '+%Y-%m-%d')"
          git push
