name: arxiv-weekly-manual-top10

on:
  workflow_dispatch:

jobs:
  recommend:
    runs-on: ubuntu-latest
    env:
      HF_HOME: .hf-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Hugging Face model files
        uses: actions/cache@v5
        with:
          path: .hf-cache
          key: hf-${{ runner.os }}-${{ hashFiles('requirements.txt', 'config.yaml') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Cache library embeddings
        uses: actions/cache@v5
        with:
          path: .cache/recommender
          key: lib-emb-${{ runner.os }}-${{ hashFiles('requirements.txt', 'config.yaml', 'data/**/*.bib') }}
          restore-keys: |
            lib-emb-${{ runner.os }}-

      - name: Install CPU PyTorch
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3.0"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly report
        run: python src/main.py --config config.yaml --lookback-days 7 --max-candidates 500 --max-results 10 --output-html "docs/weekly/$(date -u '+%Y/%m/%d')/index.html"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Add weekly arXiv recommendations for $(date -u '+%Y-%m-%d')"
          git push
